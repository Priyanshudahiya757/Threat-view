services:
  # ── PostgreSQL Database ──
  - type: postgres
    name: threatview-db
    databaseName: threatview
    user: threatview_user
    plan: free

  # ── Flask Backend Service ──
  - type: web
    name: threatview-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && flask db upgrade && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: threatview-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # ── React Frontend Service ──
  - type: web
    name: threatview-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: threatview-backend
          property: url
          append: "/api"
